# Ce qui change sur le serveur du cours (en plus de docker-compose.yml) :
#   docker compose -f docker-compose.yml -f compose.server.yaml up -d --build
#
# - L'app ne publie plus de port : on ne peut la joindre qu'à travers le Caddy
#   du serveur (dossier caddy/, à côté des projets), qui reçoit tout sur les
#   ports 80 et 443, ajoute le HTTPS et passe les requêtes à l'app.
# - L'app rejoint le réseau Docker "web" partagé avec ce Caddy, sous le nom
#   "strates".
services:
  app:
    ports: !reset []
    restart: unless-stopped
    networks:
      default:
      web:
        aliases:
          - strates

networks:
  web:
    external: true
